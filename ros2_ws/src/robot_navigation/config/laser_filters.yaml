scan_filter_node:
  ros__parameters:
    # ROS 2 laser_filters chain: each filter is an indexed MAP entry (filter1, filter2),
    # NOT a YAML list. A YAML list fails to parse in ROS 2 ("Sequence should be of same type")
    # which crashes the node on startup -> no /scan -> no map.
    # LaserScanAngularBoundsFilterInPlace masks (removes) returns BETWEEN lower_angle and
    # upper_angle, in the lidar_link frame (scan: -pi..pi, CCW).
    filter1:
      name: arm_mask_left
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        # Left solar-panel leg measured in /scan_raw: 1.325..1.923 rad (75.9..110.2 deg).
        # TIGHT mask (~2 deg margin). Wider masks removed the side-wall returns rf2o needs
        # for odometry (aperture problem -> map drift), so mask only the leg, not extra wall.
        lower_angle: 1.30
        upper_angle: 1.95
    filter2:
      name: arm_mask_right
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        # Right solar-panel leg measured: -1.975..-1.339 rad (-113..-76.7 deg).
        # TIGHT mask (~2 deg margin) to preserve side-wall returns for rf2o odometry.
        lower_angle: -1.99
        upper_angle: -1.32
