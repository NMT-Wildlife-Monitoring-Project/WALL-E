# Roboclaw driver ROS2 parameters
# Hardware-tuned settings sourced from walleroboclawsettings.cfg (BasicMicro Motion Studio)
#
# ── Hardware PID (stored on-device, configured via BasicMicro) ──────────────
# Velocity PID  M1: P=3.08918  I=0.23169  D=0    QPPS=26070
# Velocity PID  M2: P=2.63543  I=0.18177  D=0    QPPS=25410
# Position PID  M1: P=40.67662 I=0        D=0
# Position PID  M2: P=49.52638 I=0        D=0
# Default speed:  100 (both motors)
# Default accel:  2000 QPPS²
# Default decel:  2000 QPPS²
# Current limits: -30 A / +30 A (both motors)
# Auto-timeout:   10 × 100 ms = 1 s
# Main voltage:   min 5.9 V  max 27.9 V
# Logic voltage:  min 5.4 V  max 34.5 V
# Address:        128
# ────────────────────────────────────────────────────────────────────────────

roboclaw_node:
  ros__parameters:
    serial_port: /dev/roboclaw
    baudrate: 115200
    address: 128

    # Encoder counts per revolution for the wheel encoders
    qppr: 6533

    # Soft clamp applied in cmd_vel_callback.  Set to the QPPS that corresponds
    # to your desired top speed (0.4 m/s → ~9000 QPPS at qppr=6533, diam=95 mm).
    # Hardware ceiling measured by BasicMicro auto-tune: M1=26070, M2=25410.
    max_speed_qpps: 9000

    # Acceleration in QPPS² – matches roboclaw on-device default accel
    accel_qpps: 2000

    # Software speed / accel caps exposed to the planner (m/s and m/s²)
    max_speed: 0.4
    accel: 1.5

    # Physical robot dimensions
    wheel_separation: 0.39   # metres, track width
    wheel_diameter: 0.095    # metres

    # Motor direction inversion
    m1_reverse: false
    m2_reverse: false

    # Velocity PID gains from BasicMicro auto-tune (walleroboclawsettings.cfg)
    # Programmed onto the device at every connect() so SpeedAccelM1M2 has
    # proper closed-loop feedback regardless of EEPROM state.
    m1_pid_p: 3.08918
    m1_pid_i: 0.23169
    m1_pid_d: 0.0
    m1_pid_qpps: 26070   # max QPPS measured during M1 auto-tune
    m2_pid_p: 2.63543
    m2_pid_i: 0.18177
    m2_pid_d: 0.0
    m2_pid_qpps: 25410   # max QPPS measured during M2 auto-tune

    # Topic / frame names
    cmd_vel_topic: cmd_vel
    odom_topic: odom
    status_topic: roboclaw_status
    odom_frame_id: odom
    base_frame_id: base_link

    # Publish rates and timeouts
    odom_publish_rate: 20    # Hz
    status_publish_rate: 5   # Hz
    cmd_vel_timeout: 1.0     # seconds – matches roboclaw auto-timeout (10×100 ms)
