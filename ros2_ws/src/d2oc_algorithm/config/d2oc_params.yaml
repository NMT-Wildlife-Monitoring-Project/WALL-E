d2oc_explorer:
  ros__parameters:
    grid:
      width: 100.0
      height: 100.0
      resolution: 0.1

    policy:
      candidate_occ_min: 0.4
      free_occ_max: 0.5
      free_occ_min: 0.0
      top_k: 10
      nw_candidates: 5
      gamma: 0.1
      cost_offset: 1.5
      max_candidates: 500
      bary_smoothing: 0.3

    visit:
      kernel_radius: 1
      decay: 0.0

    frames:
      map: map
      base_link: base_link

    sensor:
      scan_confidence: 0.6
      enable_odom_scan_fallback: false
      max_tf_fallback_age_sec: 0.05

    publish:
      frequency: 1.0
      enable_density_map: true
      density_map_frequency: 0.5

    topics:
      scan: /scan
      odometry: /odometry/local
      costmap: /local_costmap/costmap
      exploration_goal: /exploration/goal
      density_map: /d2oc/density_map
