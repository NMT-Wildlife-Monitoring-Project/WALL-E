d2oc_explorer:
  ros__parameters:
    grid:
      width: 100.0
      height: 100.0
      resolution: 0.2

    algorithm:
      entropy_threshold: 0.8
      max_goal_distance: 20.0
      distance_weight: 0.1
      min_confidence: 0.3
      candidate_stride: 2
      max_entropy_candidates: 4000

    sensor:
      lidar_max_range: 12.0
      lidar_min_range: 0.2
      scan_confidence: 0.7
      enable_odom_scan_fallback: false

    publish:
      frequency: 1.0
      enable_density_map: true
      density_map_frequency: 0.5

    topics:
      scan: /scan
      odometry: /odometry/global
      costmap: /local_costmap/costmap
      exploration_goal: /exploration/goal
      density_map: /d2oc/density_map
